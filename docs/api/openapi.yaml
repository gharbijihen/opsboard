openapi: 3.1.0
info:
  title: OpsBoard API
  description: Incident tracking API for the OpsBoard production exercise.
  version: 1.0.0
servers:
  - url: /
paths:
  /healthz:
    get:
      summary: Liveness check
      operationId: getHealth
      tags: [System]
      security: []
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  version:
                    type: string
  /readyz:
    get:
      summary: Readiness check
      operationId: getReadiness
      tags: [System]
      security: []
      responses:
        '200':
          description: Service is ready to accept traffic
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  store:
                    type: string
                    enum: [memory, file, postgres]
                  version:
                    type: string
  /metrics:
    get:
      summary: Prometheus metrics
      operationId: getMetrics
      tags: [System]
      security: []
      responses:
        '200':
          description: Metrics in Prometheus text exposition format
          content:
            text/plain:
              schema:
                type: string
  /openapi.yaml:
    get:
      summary: This OpenAPI document
      operationId: getOpenApiSpec
      tags: [System]
      security: []
      responses:
        '200':
          description: OpenAPI document
          content:
            application/yaml:
              schema:
                type: string
  /api/incidents:
    get:
      summary: List incidents
      operationId: listIncidents
      tags: [Incidents]
      security: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/Status'
        - name: priority
          in: query
          schema:
            $ref: '#/components/schemas/Priority'
        - name: q
          in: query
          description: Free-text search on title, description, and owner
          schema:
            type: string
      responses:
        '200':
          description: Matching incidents
          content:
            application/json:
              schema:
                type: object
                properties:
                  incidents:
                    type: array
                    items:
                      $ref: '#/components/schemas/Incident'
        '400':
          $ref: '#/components/responses/ValidationError'
    post:
      summary: Create an incident
      operationId: createIncident
      tags: [Incidents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentInput'
      responses:
        '201':
          description: Incident created
          content:
            application/json:
              schema:
                type: object
                properties:
                  incident:
                    $ref: '#/components/schemas/Incident'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/incidents/{id}:
    delete:
      summary: Delete an incident
      operationId: deleteIncident
      tags: [Incidents]
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      responses:
        '204':
          description: Incident deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/incidents/{id}/status:
    patch:
      summary: Update an incident's status
      operationId: updateIncidentStatus
      tags: [Incidents]
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/Status'
      responses:
        '200':
          description: Incident updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  incident:
                    $ref: '#/components/schemas/Incident'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/stats:
    get:
      summary: Aggregate incident statistics
      operationId: getStats
      tags: [Incidents]
      security: []
      responses:
        '200':
          description: Incident statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  stats:
                    type: object
                    properties:
                      total:
                        type: integer
                      byStatus:
                        type: object
                        additionalProperties:
                          type: integer
                      openCritical:
                        type: integer
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Required for write endpoints when ADMIN_TOKEN is configured on the server.
  parameters:
    IncidentId:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    ValidationError:
      description: Request failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Priority:
      type: string
      enum: [low, medium, high, critical]
    Status:
      type: string
      enum: [open, in_progress, resolved]
    Incident:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        owner:
          type: string
        priority:
          $ref: '#/components/schemas/Priority'
        status:
          $ref: '#/components/schemas/Status'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    IncidentInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 120
        description:
          type: string
          maxLength: 1000
        owner:
          type: string
          maxLength: 80
        priority:
          $ref: '#/components/schemas/Priority'
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
            details:
              type: object
security:
  - bearerAuth: []
