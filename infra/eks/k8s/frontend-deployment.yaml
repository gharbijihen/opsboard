apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: opsboard
  labels:
    app: opsboard
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opsboard
      component: frontend
  template:
    metadata:
      labels:
        app: opsboard
        component: frontend
    spec:
      containers:
        - name: frontend
          image: PLACEHOLDER_FRONTEND_IMAGE
          ports:
            - containerPort: 8080
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
            - name: APP_VERSION
              value: initial
            - name: BACKEND_ORIGIN
              value: http://backend.opsboard.svc.cluster.local:8080
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi
