apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: opsboard
  labels:
    app: opsboard
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opsboard
      component: backend
  template:
    metadata:
      labels:
        app: opsboard
        component: backend
    spec:
      containers:
        - name: backend
          image: PLACEHOLDER_BACKEND_IMAGE
          ports:
            - containerPort: 8080
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
            - name: DATABASE_SSL
              value: "true"
            - name: APP_VERSION
              value: initial
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: opsboard-secrets
                  key: DATABASE_URL
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: opsboard-secrets
                  key: ADMIN_TOKEN
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
