apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: opsboard
  region: eu-west-3
  version: "1.31"

vpc:
  nat:
    gateway: Single

iam:
  withOIDC: true
  serviceAccounts:
    - metadata:
        name: aws-load-balancer-controller
        namespace: kube-system
      wellKnownPolicies:
        awsLoadBalancerController: true

managedNodeGroups:
  - name: opsboard-workers
    instanceType: t3.medium
    minSize: 1
    maxSize: 3
    desiredCapacity: 2
    privateNetworking: true
    volumeSize: 20
    labels:
      role: opsboard-worker
    tags:
      app: opsboard
