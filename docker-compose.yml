services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: opsboard
      POSTGRES_PASSWORD: opsboard
      POSTGRES_USER: opsboard
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsboard -d opsboard"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMIN_TOKEN: change-me-local
      DATABASE_SSL: "false"
      DATABASE_URL: postgresql://opsboard:opsboard@postgres:5432/opsboard
      NODE_ENV: production
      PORT: 8080
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/readyz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_ORIGIN: http://backend:8080
      PORT: 8080
    ports:
      - "8080:8080"

volumes:
  postgres-data:
